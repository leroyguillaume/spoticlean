{{- if include "spoticlean.caCertsGenerateSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spoticlean.caCertsSecretName" . }}
  labels:
    {{- include "spoticlean.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "spoticlean.caCertsKey" . }}: |
    {{- .Values.app.caCerts.inline | nindent 4 }}
{{- end }}
