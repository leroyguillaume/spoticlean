{{- if not .Values.app.session.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spoticlean.sessionSecretName" . }}
  labels:
    {{- include "spoticlean.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_KEY: {{ required "app.session.key or app.session.existingSecret.name is required" .Values.app.session.key | quote }}
{{- end }}
