{{- if not .Values.app.spotify.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spoticlean.spotifySecretName" . }}
  labels:
    {{- include "spoticlean.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPOTIFY_CLIENT_ID: {{ required "app.spotify.clientId or app.spotify.existingSecret.name is required" .Values.app.spotify.clientId | quote }}
{{- end }}
