[package]
name = "spoticlean"
version = "0.1.0"
edition = "2024"
description = "Finds duplicates among your Spotify Liked Songs"
authors = ["Guillaume Leroy <pro.guillaume.leroy@gmail.com>"]
repository = "https://github.com/leroyguillaume/spoticlean"
license = "MIT"
readme = "README.md"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
