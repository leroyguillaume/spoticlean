[package]
name = "spoticlean"
version = "0.1.0"
edition = "2024"
description = "Finds and removes duplicates among your Spotify Liked Songs"
authors = ["Guillaume Leroy <pro.guillaume.leroy@gmail.com>"]
repository = "https://github.com/leroyguillaume/spoticlean"
license = "MIT"
readme = "README.md"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-query", "macros"] }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
cookie = { version = "0.18.2", features = ["private"] }
futures = "0.3.34"
getrandom = "0.4.3"
indexmap = "2.14.2"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
schemars = "0.9"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
mockall = "0.15.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
