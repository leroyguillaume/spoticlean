default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: ^charts/[^/]+/templates/
      - id: check-added-large-files
        exclude: ^web/package-lock\.json$
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-toml
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Warning-level rules (document-start among them) are printed and then
        # ignored without this — the hook passes anyway.
        args:
          - --strict
        # A Helm template is Go templating, not YAML, until it is rendered.
        exclude: ^charts/[^/]+/templates/
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
  - repo: https://github.com/norwoodj/helm-docs
    rev: v1.14.2
    hooks:
      - id: helm-docs
        args:
          - --chart-search-root=charts
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.4
    hooks:
      - id: biome-check
        files: ^web/
  - repo: local
    hooks:
      - id: no-co-authors
        name: no co-authors in commit message
        entry: '^\s*co-authored-by:|\bgenerated with\b'
        language: pygrep
        args:
          - --ignore-case
        stages:
          - commit-msg
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types:
          - rust
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --locked -- -D warnings
        language: system
        types:
          - rust
        pass_filenames: false
      - id: trivy-dockerfile
        name: trivy config (Dockerfile)
        entry: trivy config --exit-code 1 Dockerfile
        language: system
        pass_filenames: false
        files: ^Dockerfile$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types:
          - shell
      - id: helm-lint
        name: helm lint
        entry: helm lint --strict -f charts/spoticlean/values-lint.yaml charts/spoticlean
        language: system
        pass_filenames: false
        files: ^charts/spoticlean/
      - id: helm-kubeconform
        name: kubeconform (rendered chart)
        entry: bash -c 'helm template spoticlean charts/spoticlean -f charts/spoticlean/values-lint.yaml --set app.ingress.enabled=true --set app.ingress.host=spoticlean.example | kubeconform -strict -summary -kubernetes-version 1.31.0'
        language: system
        pass_filenames: false
        files: ^charts/spoticlean/
      - id: trivy-chart
        name: trivy config (chart)
        entry: trivy config --exit-code 1 --config-data .trivy --helm-values charts/spoticlean/values-lint.yaml charts/spoticlean
        language: system
        pass_filenames: false
        files: ^(charts/spoticlean/|\.trivy/|\.trivyignore$)
      - id: web-openapi-client
        name: web API client generated from openapi.json
        entry: npm --prefix web run generate
        language: system
        files: ^web/(openapi\.json|openapi-ts\.config\.ts|src/api/generated/)
        pass_filenames: false
      - id: web-tsc
        name: tsc --noEmit (web)
        entry: npm --prefix web run typecheck
        language: system
        files: ^web/
        pass_filenames: false
