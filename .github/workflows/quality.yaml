name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: install the Rust toolchain
        run: rustup toolchain install
      - name: cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: install hadolint
        env:
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/$HADOLINT_VERSION/hadolint-linux-x86_64"
          echo "$HADOLINT_SHA256  $RUNNER_TEMP/hadolint" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/hadolint" /usr/local/bin/hadolint
      - name: install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.1
          cache: true
      - name: install pre-commit
        run: pipx install pre-commit
      - name: run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: install the Rust toolchain
        run: rustup toolchain install
      - name: cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: run the tests
        run: cargo test --locked
