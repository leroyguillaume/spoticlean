version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # aide is built against one schemars and one axum major: bumped
      # alone, either of them leaves two versions in the graph and the
      # trait impls stop matching.
      aide:
        patterns:
          - aide
          - axum
          - schemars
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
